name: Benchmarks

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        run: |
          PYTHONPATH=. python3 benchmarks/run_benchmark.py --population 40 --work 30000 --workers 1,2,4 --reps 3 --out benchmarks/ci_benchmark_results.csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-results
          path: benchmarks/ci_benchmark_results.csv
