name: CI Benchmark

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC (adjust as needed)
  workflow_dispatch: {}

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
      - name: Run CI benchmark
        run: |
          python benchmarks/ci_benchmark.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-results
          path: benchmarks/ci_benchmark_results.csv
